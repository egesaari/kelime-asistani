<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Kelime Asistanı</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 380px;
        }
        .custom-input {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            border-radius: 16px !important;
            padding: 14px 18px !important;
        }
        .btn-accent {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="glass-card p-4 text-center">
        <div class="fs-1 mb-2">🔒</div>
        <h4 class="fw-bold mb-1">Erişim Korumalı</h4>
        <p class="text-muted mb-4" style="font-size: 0.85rem;">Devam etmek için şifreyi giriniz.</p>

        {% if hata %}
            <div class="alert alert-danger py-2 mb-3" style="font-size:0.85rem;">{{ hata }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <input type="password" name="sifre" class="form-control custom-input text-center" placeholder="Giriş Şifresi" required autofocus>
            </div>
            <button type="submit" class="btn btn-accent w-100">Giriş Yap</button>
        </form>
    </div>
</body>
</html>
