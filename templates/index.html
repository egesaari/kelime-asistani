<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Asistanı</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-color: #6366f1;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .header-stats {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .streak-fire {
            background: linear-gradient(135deg, #f97316 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .progress {
            height: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
            border-radius: 10px;
        }

        /* Sekme (Tab) Stilleri */
        .nav-pills {
            background: rgba(15, 23, 42, 0.6);
            padding: 6px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-pills .nav-link {
            color: #94a3b8;
            font-weight: 600;
            border-radius: 14px;
            padding: 10px 16px;
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .badge-level {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
        }

        .word-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .custom-input {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            border-radius: 16px !important;
            padding: 14px 18px !important;
        }

        .custom-input:focus {
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2) !important;
        }

        .btn-accent {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-hint {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            border-radius: 12px;
        }

        .alert-custom-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            border-radius: 16px;
        }

        .alert-custom-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            border-radius: 16px;
        }

        .list-group-item {
            background: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: #fff !important;
            border-radius: 14px !important;
            margin-bottom: 8px;
        }
    </style>
</head>
<body class="py-4">
    <div class="container" style="max-width: 540px;">

        <!-- Üst Çıkış Yap Butonu -->
        <div class="d-flex justify-content-end mb-2">
            <a href="/logout" class="btn btn-sm btn-outline-danger" style="border-radius: 10px; font-size:0.75rem;">
                <i class="bi bi-box-arrow-right"></i> Çıkış Yap
            </a>
        </div>
        
        <!-- Üst İstatistik Barı -->
        <div class="glass-card p-3 mb-4 header-stats">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center gap-2">
                    <span class="fs-4">🔥</span>
                    <div>
                        <div class="fw-bold fs-5 streak-fire"><span id="stat-seri">0</span> Gün</div>
                        <div class="text-muted" style="font-size: 0.75rem;">ÇALIŞMA SERİSİ</div>
                    </div>
                </div>
                <div class="text-end">
                    <div class="fw-bold fs-6"><span id="stat-bugun">0</span> / <span id="stat-hedef">10</span></div>
                    <div class="text-muted" style="font-size: 0.75rem;">GÜNLÜK HEDEF</div>
                </div>
            </div>
            <div class="progress">
                <div id="hedef-progress" class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Üst Menü / Sekme Butonları -->
        <ul class="nav nav-pills nav-fill mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-pratik" data-bs-toggle="pill" data-bs-target="#content-pratik" type="button" role="tab">
                    <i class="bi bi-controller me-1"></i> Pratik
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-ekle" data-bs-toggle="pill" data-bs-target="#content-ekle" type="button" role="tab">
                    <i class="bi bi-plus-circle me-1"></i> Ekle
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-liste" data-bs-toggle="pill" data-bs-target="#content-liste" type="button" role="tab" onclick="kelimeleriListele()">
                    <i class="bi bi-journal-text me-1"></i> Kelimeler
                </button>
            </li>
        </ul>

        <!-- Sekme İçerikleri -->
        <div class="tab-content" id="pills-tabContent">
            
            <!-- 1. SEKME: PRATİK YAP / QUIZ -->
            <div class="tab-pane fade show active" id="content-pratik" role="tabpanel">
                <div class="glass-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-uppercase tracking-wider text-muted fw-bold" style="font-size: 0.8rem;" id="soru-yonu">İngilizce ➔ Türkçe</span>
                        <span class="badge-level" id="seviye-badge">Seviye 1</span>
                    </div>

                    <div id="quiz-box" class="text-center py-2">
                        <h1 class="word-title mb-4" id="soru-metni">Yükleniyor...</h1>

                        <div class="mb-3">
                            <input type="text" id="cevap-input" class="form-control custom-input text-center" placeholder="Cevabını yaz..." autocomplete="off">
                        </div>

                        <button class="btn btn-sm btn-hint w-100 mb-3" id="btn-ipucu" onclick="ipucuGoster()">
                            <i class="bi bi-lightbulb me-1"></i> İpucu Göster
                        </button>
                        <div id="ipucu-alani" class="alert alert-custom-success text-center d-none mb-3 p-3 fw-bold" style="font-size: 1.1rem; letter-spacing: 2px;"></div>

                        <button class="btn btn-accent w-100" onclick="cevapKontrol()">Kontrol Et</button>
                        <div id="sonuc-alani" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- 2. SEKME: KELİME EKLE -->
            <div class="tab-pane fade" id="content-ekle" role="tabpanel">
                <div class="glass-card p-4">
                    <h6 class="fw-bold mb-3 d-flex align-items-center gap-2">
                        <i class="bi bi-plus-circle-fill" style="color: #818cf8;"></i> Hızlı Kelime Ekle
                    </h6>
                    <form id="ekle-form" onsubmit="kelimeEkle(event)">
                        <div class="mb-2">
                            <input type="text" id="add-ing" class="form-control custom-input" placeholder="İngilizce kelime (Opsiyonel)">
                        </div>
                        <div class="mb-3">
                            <input type="text" id="add-turk" class="form-control custom-input" placeholder="Türkçe karşılığı (Opsiyonel)">
                        </div>
                        <button type="submit" class="btn btn-accent w-100 py-3">
                            Kaydet / Çevir ve Ekle
                        </button>
                    </form>
                    <div id="ekle-mesaj" class="mt-3"></div>
                </div>
            </div>

            <!-- 3. SEKME: KELİMELERİM (LİSTELE / SİL / DÜZENLE) -->
            <div class="tab-pane fade" id="content-liste" role="tabpanel">
                <div class="glass-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold mb-0 d-flex align-items-center gap-2">
                            <i class="bi bi-journal-bookmark-fill" style="color: #a855f7;"></i> Kayıtlı Kelimeler (<span id="toplam-kelime-sayisi">0</span>)
                        </h6>
                        <button class="btn btn-sm btn-outline-light" onclick="kelimeleriListele()" style="border-radius: 10px; font-size: 0.8rem;">
                            <i class="bi bi-arrow-clockwise"></i> Yenile
                        </button>
                    </div>
                    
                    <div id="kelime-listesi" style="max-height: 380px; overflow-y: auto;">
                        <p class="text-muted text-center my-3" style="font-size: 0.85rem;">Yükleniyor...</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Düzenleme Modalı -->
    <div class="modal fade" id="duzenleModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0 p-3">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Kelimeyi Düzenle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body border-0">
                    <input type="hidden" id="edit-id">
                    <div class="mb-3">
                        <label class="form-label text-muted">İngilizce</label>
                        <input type="text" id="edit-ing" class="form-control custom-input">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Türkçe</label>
                        <input type="text" id="edit-turk" class="form-control custom-input">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal" style="border-radius: 12px;">İptal</button>
                    <button type="button" class="btn btn-accent" onclick="kelimeDuzenleKaydet()">Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let mevcutSoru = null;
        let duzenleModal = null;

        document.addEventListener('DOMContentLoaded', () => {
            duzenleModal = new bootstrap.Modal(document.getElementById('duzenleModal'));
            yeniSoruGetir();
        });

        async function istatistikGuncelle() {
            const res = await fetch('/api/istatistik');
            if(res.status === 401) { window.location.href = '/login'; return; }
            const data = await res.json();
            document.getElementById('stat-seri').innerText = data.seri;
            document.getElementById('stat-bugun').innerText = data.bugun_cozulen;
            document.getElementById('stat-hedef').innerText = data.hedef;
            document.getElementById('toplam-kelime-sayisi').innerText = data.toplam_kelime;
            
            let yuzde = Math.min(100, Math.floor((data.bugun_cozulen / data.hedef) * 100));
            document.getElementById('hedef-progress').style.width = yuzde + '%';
        }

        async function kelimeleriListele() {
            const res = await fetch('/api/kelimeler');
            if(res.status === 401) { window.location.href = '/login'; return; }
            const data = await res.json();
            const listeDiv = document.getElementById('kelime-listesi');

            if (!data.kelimeler || data.kelimeler.length === 0) {
                listeDiv.innerHTML = '<p class="text-muted text-center my-3" style="font-size:0.85rem;">Henüz kayıtlı kelimen yok.</p>';
                return;
            }

            let html = '<div class="list-group">';
            data.kelimeler.forEach(k => {
                html += `
                    <div class="list-group-item d-flex justify-content-between align-items-center p-3">
                        <div>
                            <strong style="color: #818cf8;">${k.ingilizce}</strong>
                            <span class="text-muted mx-1">➔</span>
                            <span class="text-light">${k.turkce}</span>
                            <span class="badge badge-level ms-2" style="font-size:0.7rem;">Sev. ${k.seviye}</span>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-warning border-0" onclick="kelimeDuzenleAc(${k.id}, '${k.ingilizce}', '${k.turkce}')">
                                <i class="bi bi-pencil-fill"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger border-0 ms-1" onclick="kelimeSil(${k.id})">
                                <i class="bi bi-trash3-fill"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            listeDiv.innerHTML = html;
        }

        async function kelimeSil(id) {
            if(!confirm("Bu kelimeyi silmek istediğine emin misin?")) return;

            const res = await fetch(`/api/kelime-sil/${id}`, { method: 'DELETE' });
            if(res.status === 401) { window.location.href = '/login'; return; }
            const data = await res.json();

            if(data.status === 'success') {
                kelimeleriListele();
                yeniSoruGetir();
            }
        }

        function kelimeDuzenleAc(id, ing, turk) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-ing').value = ing;
            document.getElementById('edit-turk').value = turk;
            duzenleModal.show();
        }

        async function kelimeDuzenleKaydet() {
            const id = document.getElementById('edit-id').value;
            const ing = document.getElementById('edit-ing').value;
            const turk = document.getElementById('edit-turk').value;

            const res = await fetch(`/api/kelime-duzenle/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ingilizce: ing, turkce: turk })
            });
            if(res.status === 401) { window.location.href = '/login'; return; }
            const data = await res.json();

            if(data.status === 'success') {
                duzenleModal.hide();
                kelimeleriListele();
                yeniSoruGetir();
            }
        }

        async function yeniSoruGetir() {
            document.getElementById('cevap-input').value = '';
            document.getElementById('sonuc-alani').innerHTML = '';
            document.getElementById('ipucu-alani').classList.add('d-none');
            
            const res = await fetch('/api/soru-getir');
            if(res.status === 401) { window.location.href = '/login'; return; }
            const data = await res.json();

            if(data.status === 'empty') {
                document.getElementById('quiz-box').innerHTML = '<p class="text-muted my-4">Henüz kelime eklemedin. "Ekle" sekmesinden hemen kelime ekleyebilirsin!</p>';
                return;
            }

            mevcutSoru = data;
            document.getElementById('soru-yonu').innerText = data.soru_tipi === 'ing_turk' ? 'İngilizce ➔ Türkçe' : 'Türkçe ➔ İngilizce';
            document.getElementById('soru-metni').innerText = data.soru;
            document.getElementById('seviye-badge').innerText = 'Seviye ' + data.seviye;
            document.getElementById('cevap-input').focus();
            istatistikGuncelle();
        }

        async function cevapKontrol() {
            const cevap = document.getElementById('cevap-input').value;
            if(!cevap.trim()) return;

            const res = await fetch('/api/cevap-kontrol', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: mevcutSoru.id, cevap: cevap, soru_tipi: mevcutSoru.soru_tipi })
            });
            if(res.status === 401) { window.location.href = '/login'; return; }
            const data = await res.json();

            const sonucDiv = document.getElementById('sonuc-alani');
            if(data.dogru) {
                sonucDiv.innerHTML = `<div class="alert alert-custom-success p-3">🎉 Harika! Doğru cevap. (Yeni Seviye: ${data.yeni_seviye})</div>`;
            } else {
                sonucDiv.innerHTML = `<div class="alert alert-custom-danger p-3">❌ Yanlış! Doğru cevap: <strong>${data.dogru_cevap}</strong></div>`;
            }

            setTimeout(yeniSoruGetir, 1600);
        }

        function ipucuGoster() {
            if(mevcutSoru && mevcutSoru.ipucu) {
                document.getElementById('ipucu-alani').innerText = mevcutSoru.ipucu;
            }
            document.getElementById('ipucu-alani').classList.remove('d-none');
        }

        async function kelimeEkle(e) {
            e.preventDefault();
            const ing = document.getElementById('add-ing').value;
            const turk = document.getElementById('add-turk').value;

            const msg = document.getElementById('ekle-mesaj');
            msg.innerHTML = `<div class="alert alert-info py-2 text-center" style="font-size:0.9rem;">Çevriliyor ve ekleniyor...</div>`;

            const res = await fetch('/api/kelime-ekle', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ingilizce: ing, turkce: turk })
            });
            if(res.status === 401) { window.location.href = '/login'; return; }
            const data = await res.json();

            if(data.status === 'success') {
                msg.innerHTML = `<div class="alert alert-custom-success py-2 text-center" style="font-size:0.9rem;">${data.message}</div>`;
                document.getElementById('add-ing').value = '';
                document.getElementById('add-turk').value = '';
            } else {
                msg.innerHTML = `<div class="alert alert-custom-danger py-2 text-center" style="font-size:0.9rem;">${data.message}</div>`;
            }

            setTimeout(() => msg.innerHTML = '', 3000);
            yeniSoruGetir();
        }

        document.getElementById('cevap-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                cevapKontrol();
            }
        });
    </script>
</body>
</html>
